<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>GitHub REST Testling</title>
</head>
<body>
  <h2>Eingabe -> GitHub Datei</h2>

  <input id="owner" placeholder="GitHub-User / Org" /><br><br>
  <input id="repo" placeholder="Repo-Name" /><br><br>
  <input id="path" value="data.json" placeholder="Dateipfad im Repo" /><br><br>
  <input id="token" type="password" placeholder="GitHub Token (Repo Contents Write)" /><br><br>

  <textarea id="text" rows="4" cols="40" placeholder="Was soll gespeichert werden?"></textarea><br><br>
  <button onclick="speichern()">An GitHub senden</button>

  <pre id="status"></pre>

  <script>
    function toBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    function fromBase64(b64) {
      if (!b64) return "";
      const bin = atob(b64.replace(/\n/g, ""));
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function speichern() {
      const owner = document.getElementById("owner").value.trim();
      const repo = document.getElementById("repo").value.trim();
      const path = document.getElementById("path").value.trim();
      const token = document.getElementById("token").value.trim();
      const text = document.getElementById("text").value;
      const status = document.getElementById("status");

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };

      status.textContent = "Lade aktuellen Dateistand...";

      try {
        // 1. Aktuelle Datei holen (für SHA und bestehende Einträge)
        let sha = null;
        let daten = { eintraege: [] };

        const getRes = await fetch(url, { headers });
        if (getRes.ok) {
          const fileJson = await getRes.json();
          sha = fileJson.sha;
          const decoded = fromBase64(fileJson.content).trim();
          if (decoded.length > 0) {
            daten = JSON.parse(decoded);
            if (!Array.isArray(daten.eintraege)) daten.eintraege = [];
          }
        } else if (getRes.status !== 404) {
          throw new Error(`GET fehlgeschlagen (${getRes.status}): ${await getRes.text()}`);
        }

        // 2. Neuen Eintrag anhängen
        daten.eintraege.push({
          zeit: new Date().toISOString(),
          text: text
        });

        // 3. Datei per PUT auf GitHub schreiben
        const body = {
          message: "Test-Eintrag via lokale HTML",
          content: toBase64(JSON.stringify(daten, null, 2))
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
          method: "PUT",
          headers,
          body: JSON.stringify(body)
        });

        if (!putRes.ok) {
          throw new Error(`PUT fehlgeschlagen (${putRes.status}): ${await putRes.text()}`);
        }

        const result = await putRes.json();
        status.textContent = `Gespeichert! Commit: ${result.commit.html_url}`;
      } catch (err) {
        status.textContent = `Fehler:\n${err.message}`;
      }
    }
  </script>
</body>
</html>
