<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{todo.list.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="d-flex flex-wrap mb-4">
                <h1 class="flex-grow-1">[[#{todo.list.headline}]]</h1>
                <div>
                    <a th:href="@{/todos/add}" class="btn btn-primary ms-2">[[#{todo.list.createNew}]]</a>
                </div>
            </div>
            <div th:if="${todos.empty}">[[#{todo.list.empty}]]</div>
            <div th:if="${!todos.empty}" class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col">[[#{todo.id.label}]]</th>
                            <th scope="col">[[#{todo.todo.label}]]</th>
                            <th scope="col">[[#{todo.bemerkung.label}]]</th>
                            <th><!-- --></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="todo : ${todos}">
                            <td>[[${todo.id}]]</td>
                            <td>[[${todo.todo}]]</td>
                            <td>[[${todo.bemerkung}]]</td>
                            <td>
                                <div class="float-end text-nowrap">
                                    <a th:href="@{/todos/edit/{id}(id=${todo.id})}" class="btn btn-sm btn-secondary">[[#{todo.list.edit}]]</a>
                                    <form th:action="@{/todos/delete/{id}(id=${todo.id})}"
                                            th:data-confirm-message="#{delete.confirm}" method="post" class="js-submit-confirm d-inline">
                                        <button type="submit" class="btn btn-sm btn-secondary">[[#{todo.list.delete}]]</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
